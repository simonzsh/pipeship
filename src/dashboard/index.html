<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>shipflow</title>
    <!-- Three connected dots in a triangle. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 6L24.66 21L7.34 21Z' fill='none' stroke='%2310b981' stroke-width='2.5' stroke-linejoin='round'/><circle cx='16' cy='6' r='4.5' fill='%2310b981'/><circle cx='24.66' cy='21' r='4.5' fill='%2310b981'/><circle cx='7.34' cy='21' r='4.5' fill='%2310b981'/></svg>" />
    <!-- Set the theme before the first paint to avoid a flash of the wrong one. -->
    <script>
      const theme = localStorage.getItem("theme") ?? "system";
      const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.classList.toggle("dark", dark);
    </script>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
